<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A tab, not the cramped embedded panel Chrome shows by default: settings is a surface of its
      own (`navigation.md`), and the permission prompt reads better outside a dialog. WXT takes
      entrypoint manifest options from these meta tags, not from `wxt.config.ts`.
    -->
    <meta name="manifest.open_in_tab" content="true" />
    <title>Vigie — settings</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
